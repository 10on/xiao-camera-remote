; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = seeed_xiao_esp32s3

[common]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; XIAO ESP32S3 uses native USB CDC
build_flags =
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1
	; Dual-role BLE budget: slider + dolly (central) + 2 phones (peripheral).
	; NimBLE-Arduino defaults to 3.
	-DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=4
	-DCONFIG_BT_NIMBLE_MAX_BONDS=4
	-DBLE_SCAN_DEBUG=1

; --- Main remote firmware ---
[env:seeed_xiao_esp32s3]
extends = common
build_src_filter = +<*> -<test_color_bars.cpp> -<test_pcf8575.cpp> -<test_hello.cpp>
lib_deps =
	adafruit/Adafruit GFX Library@^1.12.6
	adafruit/Adafruit ST7735 and ST7789 Library@^1.11.0
	adafruit/Adafruit BusIO@^1.17.2
	h2zero/NimBLE-Arduino@^2.5.1

; --- Standalone display bring-up test: SMPTE-style color bars ---
; Only builds display.cpp + test_color_bars.cpp, no buttons/battery/BLE.
[env:color_bars]
extends = common
build_src_filter = -<*> +<display.cpp> +<pcf8575.cpp> +<buzzer.cpp> +<battery.cpp> +<test_color_bars.cpp>
lib_deps =
	adafruit/Adafruit GFX Library@^1.12.6
	adafruit/Adafruit ST7735 and ST7789 Library@^1.11.0
	adafruit/Adafruit BusIO@^1.17.2

; --- Standalone PCF8575 bring-up test: just I2C ACK/NACK ---
[env:pcf_test]
extends = common
build_src_filter = -<*> +<test_pcf8575.cpp>

; --- Absolute minimal sketch: just Serial.println, nothing else ---
[env:hello_test]
extends = common
build_src_filter = -<*> +<test_hello.cpp>
